<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verseny Kalkulátor v16</title>
    <style>
        :root {
            --bg: #000000;
            --card: #1c1c1e;
            --primary: #0A84FF;
            --success: #32D74B;
            --warning: #FFD60A;
            --danger: #FF453A;
            --text: #ffffff;
            --text-dim: #8e8e93;
        }

        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: var(--card); padding: 20px; border-radius: 20px; box-sizing: border-box; border: 1px solid #333; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1 1 45%; padding: 12px 5px; border: none; border-radius: 10px; cursor: pointer; background: #333; color: var(--text-dim); font-weight: bold; font-size: 0.85rem; }
        .tab-btn.active { background: var(--primary); color: white; }

        .mode-content { display: none; }
        .mode-content.active { display: block; }

        label { display: block; margin-top: 15px; font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600; }
        select, input { padding: 12px; border-radius: 10px; border: 1px solid #444; background: #2c2c2e; color: white; box-sizing: border-box; font-size: 1rem; width: 100%; margin-top: 5px; }
        
        .time-group { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
        .time-group input { text-align: center; }

        button.calc-btn { width: 100%; padding: 15px; background: var(--success); color: black; border: none; border-radius: 12px; cursor: pointer; font-weight: 800; margin-top: 20px; font-size: 1.1rem; text-transform: uppercase; }

        .result-box { margin-top: 20px; padding: 15px; background: #2c2c2e; border-radius: 14px; border-left: 6px solid var(--primary); line-height: 1.6; }
        .lap-card { background: #3a3a3c; padding: 12px; border-radius: 14px; margin-top: 15px; border: 1px solid #48484a; }
        
        .plan-box { background: #1a1a1a; border-left: 4px solid var(--success); padding: 10px; margin-top: 10px; border-radius: 8px; margin-bottom: 10px; }
        .plan-header { color: var(--success); font-weight: bold; font-size: 0.9rem; margin-bottom: 5px; display: block; }
        
        .summary-total { background: var(--primary); color: white; padding: 15px; border-radius: 12px; margin-top: 15px; }
        h4 { margin: 0; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button id="btn-verseny" class="tab-btn active" onclick="switchMode('verseny', this)">Teljes verseny</button>
        <button id="btn-reszido" class="tab-btn" onclick="switchMode('reszido', this)">Részidő</button>
        <button id="btn-terv" class="tab-btn" onclick="switchMode('terv', this)">Verseny Terv</button>
        <button id="btn-minosites" class="tab-btn" onclick="switchMode('minosites', this)">Minősítés kör avg</button>
    </div>

    <div id="verseny" class="mode-content active">
        <label>Össztáv & Körök:</label>
        <select id="totalDist" onchange="autoSetLaps('lapCount', 'lapInputsContainer', true)">
            <option value="20">20 km (1 kör)</option>
            <option value="40">40 km (2 kör)</option>
            <option value="60">60 km (3 kör)</option>
            <option value="80">80 km (3 kör)</option>
            <option value="100">100 km (4 kör)</option>
        </select>
        <select id="lapCount" onchange="genLaps('lapCount', 'lapInputsContainer', true)" style="margin-top:10px;"></select>
        
        <label>Rajt ideje:</label>
        <div class="time-group">
            <input type="number" id="vhR" placeholder="00" oninput="jump(this, 'vmR')"> :
            <input type="number" id="vmR" placeholder="00" oninput="jump(this, 'vsR')"> :
            <input type="number" id="vsR" placeholder="00">
        </div>
        <div id="lapInputsContainer"></div>
        <button class="calc-btn" onclick="calcVerseny()">Kiértékelés</button>
        <div id="res2" class="result-box" style="display:none"></div>
    </div>

    <div id="reszido" class="mode-content">
        <label>Távolság (km):</label>
        <input type="number" id="dist1" step="0.01">
        <label>Indulás:</label>
        <div class="time-group"><input type="number" id="rh1" oninput="jump(this, 'rm1')">:<input type="number" id="rm1" oninput="jump(this, 'rs1')">:<input type="number" id="rs1"></div>
        <label>Beérkezés:</label>
        <div class="time-group"><input type="number" id="rh2" oninput="jump(this, 'rm2')">:<input type="number" id="rm2" oninput="jump(this, 'rs2')">:<input type="number" id="rs2"></div>
        <button class="calc-btn" onclick="calcReszido()">Számolás</button>
        <div id="res1" class="result-box" style="display:none"></div>
    </div>

    <div id="terv" class="mode-content">
        <label>Versenytáv:</label>
        <select id="totalDistT" onchange="autoSetLaps('lapCountT', 'lapInputsContainerT', false)">
            <option value="20">20 km (1 kör)</option>
            <option value="40">40 km (2 kör)</option>
            <option value="60">60 km (3 kör)</option>
            <option value="80">80 km (3 kör)</option>
            <option value="100">100 km (4 kör)</option>
        </select>
        <select id="lapCountT" onchange="genLaps('lapCountT', 'lapInputsContainerT', false)" style="margin-top:10px;"></select>

        <label>Első kör rajtja:</label>
        <div class="time-group">
            <input type="number" id="thR" placeholder="00" oninput="jump(this, 'tmR')"> :
            <input type="number" id="tmR" placeholder="00" oninput="jump(this, 'tsR')" onkeydown="jumpBack(event, this, 'thR')"> :
            <input type="number" id="tsR" placeholder="00" onkeydown="jumpBack(event, this, 'tmR')">
        </div>
        <div id="lapInputsContainerT"></div>
        <button class="calc-btn" style="background: var(--primary); color:white;" onclick="calcTerv()">Terv Generálása</button>
        <div id="res4" class="result-box" style="display:none; border-left-color: var(--success);"></div>
    </div>

    <div id="minosites" class="mode-content">
        <label>Kör távolsága (km):</label>
        <input type="number" id="distJ" step="0.01" placeholder="pl: 20">
        <label>Kör rajtja:</label>
        <div class="time-group">
            <input type="number" id="jh1" placeholder="00" oninput="jump(this, 'jm1')"> :
            <input type="number" id="jm1" placeholder="00" oninput="jump(this, 'js1')"> :
            <input type="number" id="js1" placeholder="00">
        </div>
        <button class="calc-btn" style="background: var(--warning);" onclick="calcMinosites()">Célidő számítása</button>
        <div id="res3" class="result-box" style="display:none; border-left-color: var(--warning);"></div>
    </div>
</div>

<script>
    const CALC_LIMIT = 15.99;

    function jump(c, n) { if (c.value.length >= 2) { const e = document.getElementById(n); if(e) e.focus(); } }
    function jumpBack(e, c, p) { if (e.key === "Backspace" && c.value === "") { const el = document.getElementById(p); if(el){ el.focus(); e.preventDefault(); } } }
    
    function switchMode(m, b) { 
        document.querySelectorAll('.mode-content').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
        document.getElementById(m).classList.add('active'); b.classList.add('active');
    }

    function toSec(h, m, s) { return (parseInt(h) || 0) * 3600 + (parseInt(m) || 0) * 60 + (parseInt(s) || 0); }
    function toTimeStr(s) { 
        s = Math.max(0, s); const h = Math.floor(s / 3600); const m = Math.floor((s % 3600) / 60); const sc = s % 60;
        return [h, m, sc].map(v => String(v).padStart(2, '0')).join(':');
    }

    // TELJES VERSENY
    function calcVerseny() {
        const count = parseInt(document.getElementById('lapCount').value);
        const rajt = toSec(document.getElementById('vhR').value, document.getElementById('vmR').value, document.getElementById('vsR').value);
        if(rajt === 0) return;
        
        let curStart = rajt; 
        let html = "";
        let totalPureSec = 0;
        let totalDist = 0;
        
        for(let i = 1; i <= count; i++) {
            const d = parseFloat(document.getElementById(`vd${i}`).value) || 0;
            const arr = toSec(document.getElementById(`vh${i}`).value, document.getElementById(`vm${i}`).value, document.getElementById(`vs${i}`).value);
            if(d === 0 || arr === 0) continue;
            
            let diff = arr - curStart; if(diff <= 0) diff += 86400;
            const spd = d / (diff / 3600);
            
            totalPureSec += diff;
            totalDist += d;

            html += `<div class="plan-box" style="border-left-color:${spd>=16.0?'var(--danger)':'var(--success)'}">
                <span class="plan-header">${i}. KÖR</span>
                Átlagsebesség: <b style="color:${spd>=16.0?'var(--danger)':'var(--success)'}">${spd.toFixed(2)} km/h</b><br>
                Menetidő: <b>${toTimeStr(diff)}</b>
            </div>`;
            curStart = arr + 2400; // Pihenő utáni új rajt
        }
        
        if (totalDist > 0) {
            const avgSpd = totalDist / (totalPureSec / 3600);
            html += `<div class="summary-total">
                <strong>Összesített statisztika:</strong><br>
                Össz menetidő (pihenők nélkül): <b>${toTimeStr(totalPureSec)}</b><br>
                Teljes átlagsebesség: <b>${avgSpd.toFixed(2)} km/h</b>
            </div>`;
        }

        const r = document.getElementById('res2'); r.style.display = 'block'; r.innerHTML = html;
    }

    // RÉSZIDŐ
    function calcReszido() {
        const d = parseFloat(document.getElementById('dist1').value);
        const t1 = toSec(document.getElementById('rh1').value, document.getElementById('rm1').value, document.getElementById('rs1').value);
        const t2 = toSec(document.getElementById('rh2').value, document.getElementById('rm2').value, document.getElementById('rs2').value);
        if(!d || t1 === 0 || t2 === 0) return;
        
        let diff = t2 - t1; if(diff <= 0) diff += 86400;
        const spd = d / (diff / 3600);
        const nextStart = t2 + 2400;

        document.getElementById('res1').style.display = 'block';
        document.getElementById('res1').innerHTML = `
            Átlagsebesség: <b style="color:${spd>=16.0?'var(--danger)':'var(--success)'}">${spd.toFixed(2)} km/h</b><br>
            Menetidő: <b>${toTimeStr(diff)}</b><br><br>
            <span style="color:var(--warning)">Kimeneteli idő (40p pihenő): <b>${toTimeStr(nextStart)}</b></span>`;
    }

    // VERSENY TERV
    function calcTerv() {
        const count = parseInt(document.getElementById('lapCountT').value);
        let currentStart = toSec(document.getElementById('thR').value, document.getElementById('tmR').value, document.getElementById('tsR').value);
        if (currentStart === 0) return;
        
        let html = "<strong>Terv 16 km/h alatti átlaghoz:</strong><br>";
        for(let i = 1; i <= count; i++) {
            const d = parseFloat(document.getElementById(`td${i}`).value) || 0;
            if(d <= 0) continue;
            const minArrival = currentStart + Math.ceil(d / (CALC_LIMIT / 3600));
            const nextStart = minArrival + 2400;

            html += `
            <div class="plan-box">
                <span class="plan-header">${i}. KÖR</span>
                Rajt: ${toTimeStr(currentStart)}<br>
                Beérkezés legkorábban: <strong style="color:var(--success)">${toTimeStr(minArrival)}</strong>
                ${i < count ? `<br><span style="color:var(--text-dim)">Pihenő után kimenetel: ${toTimeStr(nextStart)}</span>` : ''}
            </div>`;
            currentStart = nextStart;
        }
        document.getElementById('res4').style.display = 'block';
        document.getElementById('res4').innerHTML = html;
    }

    // MINŐSÍTÉS KÖR AVG
    function calcMinosites() {
        const d = parseFloat(document.getElementById('distJ').value);
        const t1 = toSec(document.getElementById('jh1').value, document.getElementById('jm1').value, document.getElementById('js1').value);
        if(!d || t1 === 0) return;
        const limitSec = Math.ceil(d / (CALC_LIMIT / 3600));
        document.getElementById('res3').style.display = 'block';
        document.getElementById('res3').innerHTML = `Szükséges beérkezési idő:<br><strong style="font-size:1.8rem; color:var(--success);">${toTimeStr(t1 + limitSec)}</strong>`;
    }

    function autoSetLaps(id, cont, isReal) {
        const d = document.getElementById(id === 'lapCount' ? 'totalDist' : 'totalDistT').value;
        const s = document.getElementById(id);
        s.innerHTML = '<option value="1">1 kör</option><option value="2">2 kör</option><option value="3">3 kör</option><option value="4">4 kör</option>';
        if (d == "20") s.value = "1"; else if (d == "40") s.value = "2"; else if (d == "60" || d == "80") s.value = "3"; else if (d == "100") s.value = "4";
        genLaps(id, cont, isReal);
    }

    function genLaps(id, cont, isReal) {
        const count = document.getElementById(id).value;
        const container = document.getElementById(cont);
        container.innerHTML = '';
        const prefix = isReal ? 'v' : 't';
        for(let i = 1; i <= count; i++) {
            container.innerHTML += `<div class="lap-card"><h4>${i}. KÖR</h4><label>Táv (km):</label><input type="number" id="${prefix}d${i}" step="0.1" placeholder="20">${isReal ? `<label>Beérkezés:</label><div class="time-group"><input type="number" id="${prefix}h${i}" oninput="jump(this, '${prefix}m${i}')">:<input type="number" id="${prefix}m${i}" oninput="jump(this, '${prefix}s${i}')">:<input type="number" id="${prefix}s${i}"></div>` : ''}</div>`;
        }
    }

    window.onload = function() {
        autoSetLaps('lapCount', 'lapInputsContainer', true);
        autoSetLaps('lapCountT', 'lapInputsContainerT', false);
    };
    
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "firebase/app";
    import { getAnalytics } from "firebase/analytics";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries
    
    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyCzlVhZr9yqWB-rEV-b-jTBb-KYG1YCwIM",
      authDomain: "endurance-race-tracker.firebaseapp.com",
      projectId: "endurance-race-tracker",
      storageBucket: "endurance-race-tracker.firebasestorage.app",
      messagingSenderId: "1015097239730",
      appId: "1:1015097239730:web:4c60ec2907a62e68ef41ab",
      measurementId: "G-X0MP1HFLD4"
    };
    
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
</script>
</body>
</html>
