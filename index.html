<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Verseny Kalkulátor v4</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; display: flex; justify-content: center; padding: 20px; }
        .container { background: #1e1e1e; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); width: 500px; border: 1px solid #333; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; background: #333; color: #bbb; font-weight: bold; }
        .tab-btn.active { background: #007bff; color: white; box-shadow: 0 0 10px rgba(0,123,255,0.5); }
        
        .mode-content { display: none; }
        .mode-content.active { display: block; }

        label { display: block; margin-top: 15px; font-size: 0.85rem; color: #999; text-transform: uppercase; }
        select, input { padding: 10px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: white; box-sizing: border-box; font-size: 1rem; width: 100%; }
        
        .time-group { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
        .time-group input { text-align: center; width: 55px; }

        button.calc-btn { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 25px; font-size: 1.1rem; }
        
        .result-box { margin-top: 20px; padding: 15px; background: #252525; border-radius: 8px; border-left: 5px solid #007bff; line-height: 1.6; }
        .yellow { color: #ffff00 !important; font-weight: bold; }
        .lap-card { background: #2a2a2a; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px solid #3a3a3a; }
        .summary-box { background: #004085; color: white; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #0056b3; }
        h4 { margin: 0 0 10px 0; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchMode('reszido', this)">Részidő</button>
        <button class="tab-btn" onclick="switchMode('verseny', this)">Teljes verseny</button>
    </div>

    <div id="reszido" class="mode-content active">
        <label>Távolság (km):</label>
        <input type="number" id="dist1" step="0.01">
        <label>Indulás (ÓÓ : PP : MM):</label>
        <div class="time-group">
            <input type="text" id="rh1" maxlength="2" onkeyup="jump(this, 'rm1')"> :
            <input type="text" id="rm1" maxlength="2" onkeyup="jump(this, 'rs1')"> :
            <input type="text" id="rs1" maxlength="2" onkeyup="jump(this, 'rh2')">
        </div>
        <label>Beérkezés (ÓÓ : PP : MM):</label>
        <div class="time-group">
            <input type="text" id="rh2" maxlength="2" onkeyup="jump(this, 'rm2')"> :
            <input type="text" id="rm2" maxlength="2" onkeyup="jump(this, 'rs2')"> :
            <input type="text" id="rs2" maxlength="2">
        </div>
        <button class="calc-btn" onclick="calcReszido()">SZÁMOLÁS</button>
        <div id="res1" class="result-box" style="display:none"></div>
    </div>

    <div id="verseny" class="mode-content">
        <label>Össztáv választása:</label>
        <select id="totalDist" onchange="autoSetLaps()">
            <option value="20">20 km</option>
            <option value="40">40 km</option>
            <option value="60">60 km</option>
            <option value="80">80 km</option>
            <option value="100">100 km</option>
        </select>

        <label>Körök száma:</label>
        <select id="lapCount" onchange="genLaps()">
            <option value="1">1 kör</option>
            <option value="2">2 kör</option>
            <option value="3">3 kör</option>
            <option value="4">4 kör</option>
        </select>

        <label>Verseny rajtja (ÓÓ : PP : MM):</label>
        <div class="time-group">
            <input type="text" id="vhR" maxlength="2" onkeyup="jump(this, 'vmR')"> :
            <input type="text" id="vmR" maxlength="2" onkeyup="jump(this, 'vsR')"> :
            <input type="text" id="vsR" maxlength="2">
        </div>

        <div id="lapInputsContainer"></div>

        <button class="calc-btn" onclick="calcVerseny()">VERSENY KIÉRTÉKELÉSE</button>
        <div id="res2" class="result-box" style="display:none"></div>
    </div>
</div>

<script>
    function jump(current, nextId) {
        if (current.value.length >= 2) {
            const nextEl = document.getElementById(nextId);
            if(nextEl) nextEl.focus();
        }
    }

    function switchMode(mode, btn) {
        document.querySelectorAll('.mode-content').forEach(m => m.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(mode).classList.add('active');
        btn.classList.add('active');
    }

    // Automatikus körbeállítás a távolság alapján
    function autoSetLaps() {
        const dist = document.getElementById('totalDist').value;
        const lapSelect = document.getElementById('lapCount');
        
        if (dist == "20") lapSelect.value = "1";
        else if (dist == "40") lapSelect.value = "2";
        else if (dist == "60" || dist == "80") lapSelect.value = "3";
        else if (dist == "100") lapSelect.value = "4";
        
        genLaps();
    }

    function toSec(h, m, s) {
        return (parseInt(h) || 0) * 3600 + (parseInt(m) || 0) * 60 + (parseInt(s) || 0);
    }

    function toTimeStr(totalSec) {
        totalSec = Math.max(0, totalSec);
        const h = Math.floor(totalSec / 3600) % 24;
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
    }

    function calcReszido() {
        const d = parseFloat(document.getElementById('dist1').value);
        const t1 = toSec(document.getElementById('rh1').value, document.getElementById('rm1').value, document.getElementById('rs1').value);
        const t2 = toSec(document.getElementById('rh2').value, document.getElementById('rm2').value, document.getElementById('rs2').value);
        let diff = t2 - t1; if(diff <= 0) diff += 86400;
        const speed = d / (diff / 3600);
        const resDiv = document.getElementById('res1');
        resDiv.style.display = 'block';
        resDiv.innerHTML = `Sebesség: <span class="${speed > 16 ? 'yellow' : ''}">${speed.toFixed(2)} km/h</span><br>Pihenő vége: <strong>${toTimeStr(t2 + 2400)}</strong>`;
    }

    function genLaps() {
        const count = document.getElementById('lapCount').value;
        const container = document.getElementById('lapInputsContainer');
        container.innerHTML = '';
        const distTotal = document.getElementById('totalDist').value;

        for(let i = 1; i <= count; i++) {
            const isLast = (i == count);
            container.innerHTML += `
                <div class="lap-card">
                    <h4>${isLast ? 'CÉLBAÉRÉS' : i + '. kör'}</h4>
                    <label>Kör távja (km):</label>
                    <input type="number" id="vd${i}" step="0.1" value="${(distTotal / count).toFixed(1)}">
                    <label>${isLast ? 'Célbaérés pontos ideje' : 'Beérkezés ideje'} (ÓÓ:PP:MM):</label>
                    <div class="time-group">
                        <input type="text" id="vh${i}" maxlength="2" onkeyup="jump(this, 'vm${i}')"> :
                        <input type="text" id="vm${i}" maxlength="2" onkeyup="jump(this, 'vs${i}')"> :
                        <input type="text" id="vs${i}" maxlength="2">
                    </div>
                </div>
            `;
        }
    }
    autoSetLaps(); // Indításkor generálja az alapértelmezett köröket

    function calcVerseny() {
        const count = parseInt(document.getElementById('lapCount').value);
        const rajtSec = toSec(document.getElementById('vhR').value, document.getElementById('vmR').value, document.getElementById('vsR').value);
        let currentStart = rajtSec;
        let totalDist = 0;
        let html = "<h4>Körök részletei:</h4>";
        let lastArrSec = 0;

        for(let i = 1; i <= count; i++) {
            const d = parseFloat(document.getElementById(`vd${i}`).value) || 0;
            const arr = toSec(document.getElementById(`vh${i}`).value, document.getElementById(`vm${i}`).value, document.getElementById(`vs${i}`).value);
            totalDist += d;
            lastArrSec = arr;
            
            let diff = arr - currentStart; if(diff <= 0) diff += 86400;
            const speed = d / (diff / 3600);
            const isLast = (i == count);

            html += `<div><strong>${isLast ? 'CÉL' : i + '. kör'}:</strong> <span class="${speed > 16 ? 'yellow' : ''}">${speed.toFixed(2)} km/h</span>`;
            if(!isLast) {
                const nextStart = arr + 2400;
                html += ` | Köv. indulás: <strong>${toTimeStr(nextStart)}</strong>`;
                currentStart = nextStart;
            }
            html += `</div>`;
        }

        // Összesített számítás
        let bruttóIdő = lastArrSec - rajtSec; if(bruttóIdő <= 0) bruttóIdő += 86400;
        const összesPihenőSec = (count - 1) * 2400;
        const nettóMenetidőSec = bruttóIdő - összesPihenőSec;
        const átlagSebesség = totalDist / (nettóMenetidőSec / 3600);

        html += `<div class="summary-box">
            <strong>VERSENY ÖSSZESÍTVE:</strong><br>
            Tiszta menetidő (pihenők nélkül): ${toTimeStr(nettóMenetidőSec)}<br>
            Átlagsebesség (tiszta): <span class="${átlagSebesség > 16 ? 'yellow' : ''}">${átlagSebesség.toFixed(2)} km/h</span>
        </div>`;

        const resDiv = document.getElementById('res2');
        resDiv.style.display = 'block';
        resDiv.innerHTML = html;
    }
</script>

</body>
</html>
