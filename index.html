<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verseny Kalkulátor Pro v6</title>
    <style>
        :root {
            --bg: #000000;
            --card: #1c1c1e;
            --primary: #0A84FF;
            --success: #32D74B;
            --warning: #FFD60A;
            --text: #ffffff;
            --text-dim: #8e8e93;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%; 
            max-width: 500px; 
            background: var(--card); 
            padding: 20px; 
            border-radius: 20px; 
            box-sizing: border-box;
            border: 1px solid #333;
        }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { 
            flex: 1; 
            padding: 15px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            background: #333; 
            color: var(--text-dim); 
            font-weight: bold; 
            font-size: 1rem;
        }
        .tab-btn.active { background: var(--primary); color: white; }

        .mode-content { display: none; }
        .mode-content.active { display: block; }

        label { display: block; margin-top: 20px; font-size: 0.9rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600; }
        
        select, input { 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid #444; 
            background: #2c2c2e; 
            color: white; 
            box-sizing: border-box; 
            font-size: 1.1rem; 
            width: 100%;
            margin-top: 5px;
        }

        input:focus { outline: 2px solid var(--primary); font-size: 1.1rem; }

        .time-group { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
        .time-group input { text-align: center; width: 100%; }
        .time-group span { font-size: 1.5rem; color: #555; font-weight: bold; }

        button.calc-btn { 
            width: 100%; 
            padding: 18px; 
            background: var(--success); 
            color: black; 
            border: none; 
            border-radius: 14px; 
            cursor: pointer; 
            font-weight: 800; 
            margin-top: 30px; 
            font-size: 1.2rem; 
            text-transform: uppercase;
        }

        .result-box { 
            margin-top: 25px; 
            padding: 15px; 
            background: #2c2c2e; 
            border-radius: 14px; 
            border-left: 6px solid var(--primary); 
            line-height: 1.8;
            font-size: 1.1rem;
        }

        .speed-val { font-weight: bold; font-size: 1.2rem; }
        .green { color: var(--success); }
        .yellow { color: var(--warning); text-shadow: 0 0 8px rgba(255, 214, 10, 0.4); }

        .lap-card { 
            background: #3a3a3c; 
            padding: 15px; 
            border-radius: 16px; 
            margin-top: 20px; 
            border: 1px solid #48484a; 
        }

        .summary-box { 
            background: var(--primary); 
            color: white; 
            padding: 18px; 
            border-radius: 16px; 
            margin-top: 20px; 
            box-shadow: 0 4px 15px rgba(10, 132, 255, 0.3);
        }

        .lap-time-info { color: #bfbfbf; font-size: 0.95rem; }
        h4 { margin: 0 0 10px 0; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button id="btn-verseny" class="tab-btn active" onclick="switchMode('verseny', this)">Full Verseny</button>
        <button id="btn-reszido" class="tab-btn" onclick="switchMode('reszido', this)">Részidő</button>
    </div>

    <div id="verseny" class="mode-content active">
        <label>Távolság választása:</label>
        <select id="totalDist" onchange="autoSetLaps()">
            <option value="20">20 km (1 kör)</option>
            <option value="40">40 km (2 kör)</option>
            <option value="60">60 km (3 kör)</option>
            <option value="80">80 km (3 kör)</option>
            <option value="100">100 km (4 kör)</option>
        </select>

        <label>Körök száma:</label>
        <select id="lapCount" onchange="genLaps()">
            <option value="1">1 kör</option>
            <option value="2">2 kör</option>
            <option value="3">3 kör</option>
            <option value="4">4 kör</option>
        </select>

        <label>Verseny rajtja (ÓÓ : PP : MM):</label>
        <div class="time-group">
            <input type="number" id="vhR" pattern="\d*" placeholder="00" oninput="jump(this, 'vmR')"> <span>:</span>
            <input type="number" id="vmR" pattern="\d*" placeholder="00" oninput="jump(this, 'vsR')" onkeydown="jumpBack(event, this, 'vhR')"> <span>:</span>
            <input type="number" id="vsR" pattern="\d*" placeholder="00" onkeydown="jumpBack(event, this, 'vmR')">
        </div>

        <div id="lapInputsContainer"></div>

        <button class="calc-btn" onclick="calcVerseny()">Számítás Mehet</button>
        <div id="res2" class="result-box" style="display:none"></div>
    </div>

    <div id="reszido" class="mode-content">
        <label>Távolság (km):</label>
        <input type="number" id="dist1" step="0.01" placeholder="pl: 15.5">
        
        <label>Indulás (ÓÓ : PP : MM):</label>
        <div class="time-group">
            <input type="number" id="rh1" pattern="\d*" placeholder="00" oninput="jump(this, 'rm1')"> :
            <input type="number" id="rm1" pattern="\d*" placeholder="00" oninput="jump(this, 'rs1')" onkeydown="jumpBack(event, this, 'rh1')"> :
            <input type="number" id="rs1" pattern="\d*" placeholder="00" oninput="jump(this, 'rh2')" onkeydown="jumpBack(event, this, 'rm1')">
        </div>

        <label>Beérkezés (ÓÓ : PP : MM):</label>
        <div class="time-group">
            <input type="number" id="rh2" pattern="\d*" placeholder="00" oninput="jump(this, 'rm2')" onkeydown="jumpBack(event, this, 'rs1')"> :
            <input type="number" id="rm2" pattern="\d*" placeholder="00" oninput="jump(this, 'rs2')" onkeydown="jumpBack(event, this, 'rh2')"> :
            <input type="number" id="rs2" pattern="\d*" placeholder="00" onkeydown="jumpBack(event, this, 'rm2')">
        </div>
        <button class="calc-btn" onclick="calcReszido()">Részidő Számolás</button>
        <div id="res1" class="result-box" style="display:none"></div>
    </div>
</div>

<script>
    // Előre ugrás, ha 2 számjegyet beírtál
    function jump(current, nextId) {
        if (current.value.length >= 2) {
            const nextEl = document.getElementById(nextId);
            if(nextEl) nextEl.focus();
        }
    }

    // Vissza ugrás törlés (Backspace) esetén
    function jumpBack(event, current, prevId) {
        if (event.key === "Backspace" && current.value === "") {
            const prevEl = document.getElementById(prevId);
            if (prevEl) {
                prevEl.focus();
                // Késleltetés nélkül a fókusz áthelyezése
                event.preventDefault(); 
            }
        }
    }

    function switchMode(mode, btn) {
        document.querySelectorAll('.mode-content').forEach(m => m.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(mode).classList.add('active');
        btn.classList.add('active');
    }

    function toSec(h, m, s) { return (parseInt(h) || 0) * 3600 + (parseInt(m) || 0) * 60 + (parseInt(s) || 0); }
    
    function toTimeStr(totalSec) {
        totalSec = Math.max(0, totalSec);
        const h = Math.floor(totalSec / 3600) % 24;
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
    }

    function autoSetLaps() {
        const dist = document.getElementById('totalDist').value;
        const lapSelect = document.getElementById('lapCount');
        if (dist == "20") lapSelect.value = "1";
        else if (dist == "40") lapSelect.value = "2";
        else if (dist == "60" || dist == "80") lapSelect.value = "3";
        else if (dist == "100") lapSelect.value = "4";
        genLaps();
    }

    // Generált körökbe is beépítve a backspace ugrás
    function genLaps() {
        const count = document.getElementById('lapCount').value;
        const container = document.getElementById('lapInputsContainer');
        container.innerHTML = '';
        for(let i = 1; i <= count; i++) {
            const isLast = (i == count);
            container.innerHTML += `
                <div class="lap-card">
                    <h4 style="color:${isLast ? '#32D74B' : '#0A84FF'}">${isLast ? '🏁 CÉLBAÉRÉS' : i + '. KÖR'}</h4>
                    <label>Kör távja (km):</label>
                    <input type="number" id="vd${i}" step="0.1" placeholder="Add meg a km-t">
                    <label>${isLast ? 'Beérkezés ideje' : 'Beérkezés ideje'} (ÓÓ:PP:MM):</label>
                    <div class="time-group">
                        <input type="number" id="vh${i}" pattern="\d*" placeholder="00" oninput="jump(this, 'vm${i}')"> :
                        <input type="number" id="vm${i}" pattern="\d*" placeholder="00" oninput="jump(this, 'vs${i}')" onkeydown="jumpBack(event, this, 'vh${i}')"> :
                        <input type="number" id="vs${i}" pattern="\d*" placeholder="00" onkeydown="jumpBack(event, this, 'vm${i}')">
                    </div>
                </div>
            `;
        }
    }
    autoSetLaps();

    function calcVerseny() {
        const count = parseInt(document.getElementById('lapCount').value);
        const rajtSec = toSec(document.getElementById('vhR').value, document.getElementById('vmR').value, document.getElementById('vsR').value);
        let currentStart = rajtSec;
        let totalDist = 0;
        let lastArrSec = 0;
        let html = "<strong>Körök bontása:</strong><br>";

        for(let i = 1; i <= count; i++) {
            const d = parseFloat(document.getElementById(`vd${i}`).value) || 0;
            const arr = toSec(document.getElementById(`vh${i}`).value, document.getElementById(`vm${i}`).value, document.getElementById(`vs${i}`).value);
            totalDist += d;
            lastArrSec = arr;
            
            let diff = arr - currentStart; if(diff <= 0) diff += 86400;
            const speed = d / (diff / 3600);
            const isLast = (i == count);

            html += `<div style="margin-top:10px; padding-bottom:10px; border-bottom:1px solid #444;">`;
            html += `<strong>${isLast ? 'CÉL' : i + '. kör'}:</strong> <span class="speed-val ${speed > 16 ? 'yellow' : 'green'}">${speed.toFixed(2)} km/h</span><br>`;
            html += `<span class="lap-time-info">Eltelt idő: ${toTimeStr(diff)}</span>`;
            
            if(!isLast) {
                const nextStart = arr + 2400;
                html += `<br><span>Köv. indulás: <strong>${toTimeStr(nextStart)}</strong></span>`;
                currentStart = nextStart;
            }
            html += `</div>`;
        }

        let bruttoSec = lastArrSec - rajtSec; if(bruttoSec <= 0) bruttoSec += 86400;
        const pihenoSec = (count - 1) * 2400;
        const nettoSec = bruttoSec - pihenoSec;
        const atlagSpeed = totalDist / (nettoSec / 3600);

        html += `<div class="summary-box">
            <strong>VÉGEREDMÉNY</strong><br>
            Tiszta menetidő: <strong>${toTimeStr(nettoSec)}</strong><br>
            Össz. táv: ${totalDist.toFixed(1)} km<br>
            Átlagsebesség: <span class="speed-val ${atlagSpeed > 16 ? 'yellow' : 'white'}">${atlagSpeed.toFixed(2)} km/h</span>
        </div>`;

        const resDiv = document.getElementById('res2');
        resDiv.style.display = 'block';
        resDiv.innerHTML = html;
        resDiv.scrollIntoView({behavior: "smooth"});
    }

    function calcReszido() {
        const d = parseFloat(document.getElementById('dist1').value);
        const t1 = toSec(document.getElementById('rh1').value, document.getElementById('rm1').value, document.getElementById('rs1').value);
        const t2 = toSec(document.getElementById('rh2').value, document.getElementById('rm2').value, document.getElementById('rs2').value);
        let diff = t2 - t1; if(diff <= 0) diff += 86400;
        const speed = d / (diff / 3600);
        const resDiv = document.getElementById('res1');
        resDiv.style.display = 'block';
        resDiv.innerHTML = `Sebesség: <span class="speed-val ${speed > 16 ? 'yellow' : 'green'}">${speed.toFixed(2)} km/h</span><br>Idő: ${toTimeStr(diff)}<br>Köv. indulás: <strong>${toTimeStr(t2 + 2400)}</strong>`;
    }
</script>

</body>
</html>
