<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verseny Kalkulátor v20 - Orvosi és Pulzus idővel</title>
    <style>
        :root {
            --bg: #000000;
            --card: #1c1c1e;
            --primary: #0A84FF;
            --success: #32D74B;
            --warning: #FF9F0A;
            --danger: #FF453A;
            --text: #ffffff;
            --text-dim: #8e8e93;
        }

        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: var(--card); padding: 20px; border-radius: 20px; box-sizing: border-box; border: 1px solid #333; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1 1 30%; padding: 12px 5px; border: none; border-radius: 10px; cursor: pointer; background: #333; color: var(--text-dim); font-weight: bold; font-size: 0.85rem; }
        .tab-btn.active { background: var(--primary); color: white; }

        .mode-content { display: none; }
        .mode-content.active { display: block; }

        label { display: block; margin-top: 15px; font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600; }
        select, input { padding: 12px; border-radius: 10px; border: 1px solid #444; background: #2c2c2e; color: white; box-sizing: border-box; font-size: 1rem; width: 100%; margin-top: 5px; }
        
        .time-group { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
        .time-group input { text-align: center; }

        button.calc-btn { width: 100%; padding: 15px; background: var(--success); color: black; border: none; border-radius: 12px; cursor: pointer; font-weight: 800; margin-top: 20px; font-size: 1.1rem; text-transform: uppercase; }
        button.add-btn { background: var(--primary); color: white; }

        .result-box { margin-top: 20px; padding: 15px; background: #2c2c2e; border-radius: 14px; border-left: 6px solid var(--primary); line-height: 1.6; }
        .lap-card { background: #3a3a3c; padding: 12px; border-radius: 14px; margin-top: 15px; border: 1px solid #48484a; }
        
        .plan-box { background: #1a1a1a; border-left: 4px solid var(--success); padding: 10px; margin-top: 10px; border-radius: 8px; margin-bottom: 10px; }
        .plan-header { color: var(--success); font-weight: bold; font-size: 0.9rem; margin-bottom: 5px; display: block; }
        .plan-data-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 3px; }
        .plan-data-label { color: var(--text-dim); }
        
        .summary-total { background: #1c1c1e; color: var(--text); padding: 15px; border-radius: 12px; margin-top: 15px; border: 1px solid var(--primary); }
        h4 { margin: 0; color: var(--primary); }

        .competitor-item { background: #2c2c2e; padding: 10px; border-radius: 8px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--primary); }
        .competitor-info { font-size: 0.9rem; }
        .competitor-bib { font-weight: bold; color: var(--warning); font-size: 1.1rem; margin-right: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button id="btn-versenyzok" class="tab-btn active" onclick="switchMode('versenyzok', this)">Versenyzők</button>
        <button id="btn-verseny" class="tab-btn" onclick="switchMode('verseny', this)">Teljes verseny</button>
        <button id="btn-reszido" class="tab-btn" onclick="switchMode('reszido', this)">Részidő</button>
        <button id="btn-terv" class="tab-btn" onclick="switchMode('terv', this)">Verseny Terv</button>
        <button id="btn-minosites" class="tab-btn" onclick="switchMode('minosites', this)">Kör avg</button>
    </div>

    <div id="versenyzok" class="mode-content active">
        <h4 style="margin-bottom: 15px; color: white;">Új versenyző regisztrálása</h4>
        
        <label>Rajtszám:</label>
        <input type="number" id="regBib" placeholder="pl. 23">
        
        <label>Versenyző neve:</label>
        <input type="text" id="regName" placeholder="pl. Kovács János">
        
        <label>Versenytáv:</label>
        <select id="regDist">
            <option value="20">20 km</option>
            <option value="40">40 km</option>
            <option value="60">60 km</option>
            <option value="80">80 km</option>
            <option value="100">100 km</option>
        </select>
        
        <button class="calc-btn add-btn" onclick="addCompetitor()">Hozzáadás</button>

        <h4 style="margin-top: 30px; margin-bottom: 10px; color: var(--text-dim);">Regisztrált versenyzők:</h4>
        <div id="competitorList">
            <div style="color: var(--text-dim); font-size: 0.8rem; font-style: italic;">Még nincs versenyző regisztrálva.</div>
        </div>
    </div>

    <div id="verseny" class="mode-content">
        <label style="color: var(--primary);">Versenyző kiválasztása:</label>
        <select id="selectCompetitor" onchange="loadCompetitorData()" style="border-color: var(--primary);">
            <option value="">-- Manuális bevitel --</option>
        </select>

        <label>Össztáv & Körök:</label>
        <select id="totalDist" onchange="autoSetLaps('lapCount', 'lapInputsContainer', true)">
            <option value="20">20 km (1 kör)</option>
            <option value="40">40 km (2 kör)</option>
            <option value="60">60 km (3 kör)</option>
            <option value="80">80 km (3 kör)</option>
            <option value="100">100 km (4 kör)</option>
        </select>
        <select id="lapCount" onchange="genLaps('lapCount', 'lapInputsContainer', true)" style="margin-top:10px;"></select>
        
        <label>Rajt ideje:</label>
        <div class="time-group">
            <input type="number" id="vhR" placeholder="00" oninput="jump(this, 'vmR')"> :
            <input type="number" id="vmR" placeholder="00" oninput="jump(this, 'vsR')"> :
            <input type="number" id="vsR" placeholder="00">
        </div>
        <div id="lapInputsContainer"></div>
        <button class="calc-btn" onclick="calcVerseny()">Kiértékelés</button>
        <div id="res2" class="result-box" style="display:none"></div>
    </div>

    <div id="reszido" class="mode-content">
        <label>Távolság (km):</label>
        <input type="number" id="dist1" step="0.01">
        <label>Indulás:</label>
        <div class="time-group"><input type="number" id="rh1" oninput="jump(this, 'rm1')">:<input type="number" id="rm1" oninput="jump(this, 'rs1')">:<input type="number" id="rs1"></div>
        <label>Beérkezés:</label>
        <div class="time-group"><input type="number" id="rh2" oninput="jump(this, 'rm2')">:<input type="number" id="rm2" oninput="jump(this, 'rs2')">:<input type="number" id="rs2"></div>
        <button class="calc-btn" onclick="calcReszido()">Számolás</button>
        <div id="res1" class="result-box" style="display:none"></div>
    </div>

    <div id="terv" class="mode-content">
        <label>Versenytáv:</label>
        <select id="totalDistT" onchange="autoSetLaps('lapCountT', 'lapInputsContainerT', false)">
            <option value="20">20 km (1 kör)</option>
            <option value="40">40 km (2 kör)</option>
            <option value="60">60 km (3 kör)</option>
            <option value="80">80 km (3 kör)</option>
            <option value="100">100 km (4 kör)</option>
        </select>
        <select id="lapCountT" onchange="genLaps('lapCountT', 'lapInputsContainerT', false)" style="margin-top:10px;"></select>

        <label>Első kör rajtja:</label>
        <div class="time-group">
            <input type="number" id="thR" placeholder="00" oninput="jump(this, 'tmR')"> :
            <input type="number" id="tmR" placeholder="00" oninput="jump(this, 'tsR')"> :
            <input type="number" id="tsR" placeholder="00">
        </div>
        <div id="lapInputsContainerT"></div>
        <button class="calc-btn" style="background: var(--primary); color:white;" onclick="calcTerv()">Terv Generálása</button>
        <div id="res4" class="result-box" style="display:none; border-left-color: var(--success);"></div>
    </div>

    <div id="minosites" class="mode-content">
        <label>Kör távolsága (km):</label>
        <input type="number" id="distJ" step="0.01" placeholder="pl: 20">
        <label>Kör rajtja:</label>
        <div class="time-group">
            <input type="number" id="jh1" placeholder="00" oninput="jump(this, 'jm1')"> :
            <input type="number" id="jm1" placeholder="00" oninput="jump(this, 'js1')"> :
            <input type="number" id="js1" placeholder="00">
        </div>
        <button class="calc-btn" style="background: var(--warning);" onclick="calcMinosites()">Célidő számítása</button>
        <div id="res3" class="result-box" style="display:none; border-left-color: var(--warning);"></div>
    </div>
</div>

<script>
    const CALC_LIMIT = 15.99;
    let competitors = [];

    function jump(c, n) { if (c.value.length >= 2) { const e = document.getElementById(n); if(e) e.focus(); } }
    
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName.toLowerCase() === 'input') {
            if (e.key === 'Enter') {
                e.preventDefault();
                const elements = Array.from(document.querySelectorAll('.mode-content.active input, .mode-content.active select, .mode-content.active button.calc-btn'));
                const index = elements.indexOf(e.target);
                if (index > -1 && index < elements.length - 1) {
                    elements[index + 1].focus();
                }
            } 
            else if (e.key === 'Backspace' && e.target.value === '') {
                const group = e.target.closest('.time-group');
                if (group) {
                    const timeInputs = Array.from(group.querySelectorAll('input'));
                    const idx = timeInputs.indexOf(e.target);
                    if (idx > 0) {
                        e.preventDefault();
                        timeInputs[idx - 1].focus();
                    }
                }
            }
        }
    });

    function switchMode(m, b) { 
        document.querySelectorAll('.mode-content').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
        document.getElementById(m).classList.add('active'); b.classList.add('active');
    }

    function toSec(h, m, s) { return (parseInt(h) || 0) * 3600 + (parseInt(m) || 0) * 60 + (parseInt(s) || 0); }
    function toTimeStr(s) { 
        s = Math.max(0, s); const h = Math.floor(s / 3600); const m = Math.floor((s % 3600) / 60); const sc = s % 60;
        return [h, m, sc].map(v => String(v).padStart(2, '0')).join(':');
    }

    function addCompetitor() {
        const bib = document.getElementById('regBib').value;
        const name = document.getElementById('regName').value;
        const dist = document.getElementById('regDist').value;

        if (!bib || !name) {
            alert("Kérlek add meg a rajtszámot és a nevet is!");
            return;
        }

        competitors.push({ 
            bib: bib, 
            name: name, 
            dist: dist,
            startTime: { h: '', m: '', s: '' },
            laps: []
        });
        
        document.getElementById('regBib').value = '';
        document.getElementById('regName').value = '';
        document.getElementById('regBib').focus();

        updateCompetitorDisplays();
    }

    function updateCompetitorDisplays() {
        const listContainer = document.getElementById('competitorList');
        listContainer.innerHTML = '';
        
        const selectContainer = document.getElementById('selectCompetitor');
        selectContainer.innerHTML = '<option value="">-- Manuális bevitel --</option>';

        competitors.sort((a, b) => parseInt(a.bib) - parseInt(b.bib));

        competitors.forEach(comp => {
            listContainer.innerHTML += `
                <div class="competitor-item">
                    <div class="competitor-info">
                        <span class="competitor-bib">#${comp.bib}</span>
                        <strong>${comp.name}</strong>
                    </div>
                    <div style="color:var(--primary); font-weight:bold;">${comp.dist} km</div>
                </div>
            `;
            selectContainer.innerHTML += `<option value="${comp.bib}">#${comp.bib} - ${comp.name} (${comp.dist}km)</option>`;
        });
    }

    function loadCompetitorData() {
        const selectedBib = document.getElementById('selectCompetitor').value;
        const resBox = document.getElementById('res2');
        
        if (!selectedBib) {
            // MANUÁLIS MÓD: Mindent kiürítünk
            resBox.style.display = 'none';
            document.getElementById('vhR').value = '';
            document.getElementById('vmR').value = '';
            document.getElementById('vsR').value = '';
            
            const count = parseInt(document.getElementById('lapCount').value) || 1;
            for(let i = 1; i <= count; i++) {
                if(document.getElementById(`vd${i}`)) document.getElementById(`vd${i}`).value = '';
                if(document.getElementById(`vh${i}`)) document.getElementById(`vh${i}`).value = '';
                if(document.getElementById(`vm${i}`)) document.getElementById(`vm${i}`).value = '';
                if(document.getElementById(`vs${i}`)) document.getElementById(`vs${i}`).value = '';
                if(document.getElementById(`ovh${i}`)) document.getElementById(`ovh${i}`).value = '';
                if(document.getElementById(`ovm${i}`)) document.getElementById(`ovm${i}`).value = '';
                if(document.getElementById(`ovs${i}`)) document.getElementById(`ovs${i}`).value = '';
            }
            return; 
        }

        // KIVÁLASZTOTT VERSENYZŐ BETÖLTÉSE
        const comp = competitors.find(c => c.bib === selectedBib);
        if (comp) {
            document.getElementById('totalDist').value = comp.dist;
            autoSetLaps('lapCount', 'lapInputsContainer', true);

            document.getElementById('vhR').value = comp.startTime.h || '';
            document.getElementById('vmR').value = comp.startTime.m || '';
            document.getElementById('vsR').value = comp.startTime.s || '';

            comp.laps.forEach((lap, idx) => {
                const i = idx + 1;
                if (document.getElementById(`vd${i}`)) {
                    document.getElementById(`vd${i}`).value = lap.d || '';
                    document.getElementById(`vh${i}`).value = lap.h || '';
                    document.getElementById(`vm${i}`).value = lap.m || '';
                    document.getElementById(`vs${i}`).value = lap.s || '';
                    document.getElementById(`ovh${i}`).value = lap.oh || '';
                    document.getElementById(`ovm${i}`).value = lap.om || '';
                    document.getElementById(`ovs${i}`).value = lap.os || '';
                }
            });

            if (comp.startTime.h || comp.laps.length > 0) {
                calcVerseny();
            } else {
                resBox.style.display = 'none';
            }
        }
    }

    function calcVerseny() {
        const count = parseInt(document.getElementById('lapCount').value);
        const selectedBib = document.getElementById('selectCompetitor').value;
        
        // MENTÉS CSAK AKKOR, HA VAN KIVÁLASZTOTT VERSENYZŐ (Nem manuális)
        if (selectedBib !== "") {
            const comp = competitors.find(c => c.bib === selectedBib);
            if (comp) {
                comp.startTime = {
                    h: document.getElementById('vhR').value,
                    m: document.getElementById('vmR').value,
                    s: document.getElementById('vsR').value
                };
                comp.laps = [];
                for(let i = 1; i <= count; i++) {
                    comp.laps.push({
                        d: document.getElementById(`vd${i}`).value,
                        h: document.getElementById(`vh${i}`).value,
                        m: document.getElementById(`vm${i}`).value,
                        s: document.getElementById(`vs${i}`).value,
                        oh: document.getElementById(`ovh${i}`).value,
                        om: document.getElementById(`ovm${i}`).value,
                        os: document.getElementById(`ovs${i}`).value
                    });
                }
            }
        }

        const rajt = toSec(document.getElementById('vhR').value, document.getElementById('vmR').value, document.getElementById('vsR').value);
        const resBox = document.getElementById('res2');
        
        if(rajt === 0) {
            resBox.style.display = 'none';
            return;
        }
        
        let curStart = rajt; 
        let html = "";
        let totalPureSec = 0;
        let totalDist = 0;
        
        for(let i = 1; i <= count; i++) {
            const d = parseFloat(document.getElementById(`vd${i}`).value) || 0;
            const arr = toSec(document.getElementById(`vh${i}`).value, document.getElementById(`vm${i}`).value, document.getElementById(`vs${i}`).value);
            const vet = toSec(document.getElementById(`ovh${i}`).value, document.getElementById(`ovm${i}`).value, document.getElementById(`ovs${i}`).value);
            
            if(d === 0 || arr === 0) continue;
            
            // Kapu (Beérkezés) számolása
            let diffArr = arr - curStart; if(diffArr <= 0) diffArr += 86400;
            const spdArr = d / (diffArr / 3600);
            
            let pureSecForLap = diffArr;
            let nextStart = arr + 2400; // Alapból a kaputól számolunk pihenőt, ha nincs még orvosi
            let vetHtml = "";

            // Ha van orvosi idő beírva, akkor az alapján számolunk tovább
            if (vet > 0) {
                let diffVet = vet - curStart; if(diffVet <= 0) diffVet += 86400;
                const spdVet = d / (diffVet / 3600);
                
                let pulzusTime = vet - arr; if(pulzusTime < 0) pulzusTime += 86400;
                
                pureSecForLap = diffVet; // Teljes menetidő orvosival
                nextStart = vet + 2400; // Pihenő az ORVOSITÓL indul!
                
                const vetColor = spdVet >= 16.0 ? 'var(--warning)' : 'var(--success)';
                
                vetHtml = `
                    <div style="margin-top:6px; border-top:1px dashed #444; padding-top:6px;"></div>
                    <div class="plan-data-row"><span class="plan-data-label">Orvosi idő:</span> <b style="color:white;">${toTimeStr(diffVet)}</b></div>
                    <div class="plan-data-row"><span class="plan-data-label">Orvosi átlag:</span> <b style="color:${vetColor};">${spdVet.toFixed(2)} km/h</b></div>
                    <div class="plan-data-row"><span class="plan-data-label">Pulzus idő:</span> <b style="color:var(--primary);">${toTimeStr(pulzusTime)}</b></div>
                `;
            }

            totalPureSec += pureSecForLap;
            totalDist += d;

            const colorVar = spdArr >= 16.0 ? 'var(--warning)' : 'var(--success)';

            html += `<div class="plan-box" style="border-left-color:${colorVar}">
                <span class="plan-header" style="color:${colorVar}">${i}. KÖR</span>
                <div class="plan-data-row"><span class="plan-data-label">Kapu idő:</span> <b style="color:white;">${toTimeStr(diffArr)}</b></div>
                <div class="plan-data-row"><span class="plan-data-label">Kapu átlag:</span> <b style="color:${colorVar}">${spdArr.toFixed(2)} km/h</b></div>
                ${vetHtml}
                ${i < count ? `<div style="margin-top:8px; padding-top:8px; border-top:1px solid #333; font-size:0.9rem; color:var(--text-dim);">Kimenetel pihenő (40p) után: <b style="color:white; float:right;">${toTimeStr(nextStart)}</b></div>` : ''}
            </div>`;
            curStart = nextStart;
        }
        
        if (totalDist > 0) {
            const avgSpd = totalDist / (totalPureSec / 3600);
            const avgColor = avgSpd >= 16.0 ? 'var(--warning)' : 'var(--success)';
            html += `<div class="summary-total">
                <strong style="color:var(--primary); font-size:1.1rem; display:block; margin-bottom:8px;">Összesített statisztika</strong>
                <div class="plan-data-row"><span class="plan-data-label" style="color:#ccc;">Össz menetidő:</span> <b style="color:white;">${toTimeStr(totalPureSec)}</b></div>
                <div class="plan-data-row"><span class="plan-data-label" style="color:#ccc;">Teljes átlagsebesség:</span> <b style="font-size:1.3rem; color:${avgColor}">${avgSpd.toFixed(2)} km/h</b></div>
            </div>`;
        }

        resBox.style.display = 'block'; 
        resBox.innerHTML = html;
    }

    // RÉSZIDŐ
    function calcReszido() {
        const d = parseFloat(document.getElementById('dist1').value);
        const t1 = toSec(document.getElementById('rh1').value, document.getElementById('rm1').value, document.getElementById('rs1').value);
        const t2 = toSec(document.getElementById('rh2').value, document.getElementById('rm2').value, document.getElementById('rs2').value);
        if(!d || t1 === 0 || t2 === 0) return;
        
        let diff = t2 - t1; if(diff <= 0) diff += 86400;
        const spd = d / (diff / 3600);
        const nextStart = t2 + 2400;

        document.getElementById('res1').style.display = 'block';
        document.getElementById('res1').innerHTML = `
            Átlagsebesség: <b style="color:${spd>=16.0?'var(--warning)':'var(--success)'}">${spd.toFixed(2)} km/h</b><br>
            Menetidő: <b>${toTimeStr(diff)}</b><br><br>
            <span style="color:var(--text-dim)">Kimeneteli idő (40p pihenő): <b style="color:white;">${toTimeStr(nextStart)}</b></span>`;
    }

    // VERSENY TERV
    function calcTerv() {
        const count = parseInt(document.getElementById('lapCountT').value);
        let currentStart = toSec(document.getElementById('thR').value, document.getElementById('tmR').value, document.getElementById('tsR').value);
        if (currentStart === 0) return;
        
        let html = "<strong style='color:var(--text);'>Terv 16 km/h alatti átlaghoz:</strong><br>";
        for(let i = 1; i <= count; i++) {
            const d = parseFloat(document.getElementById(`td${i}`).value) || 0;
            if(d <= 0) continue;
            const minArrival = currentStart + Math.ceil(d / (CALC_LIMIT / 3600));
            const nextStart = minArrival + 2400;

            html += `
            <div class="plan-box">
                <span class="plan-header">${i}. KÖR</span>
                Rajt: ${toTimeStr(currentStart)}<br>
                Beérkezés legkorábban: <strong style="color:var(--success)">${toTimeStr(minArrival)}</strong>
                ${i < count ? `<br><span style="color:var(--text-dim)">Kimenetel pihenő (40p) után: <b style="color:white;">${toTimeStr(nextStart)}</b></span>` : ''}
            </div>`;
            currentStart = nextStart;
        }
        document.getElementById('res4').style.display = 'block';
        document.getElementById('res4').innerHTML = html;
    }

    // MINŐSÍTÉS KÖR AVG
    function calcMinosites() {
        const d = parseFloat(document.getElementById('distJ').value);
        const t1 = toSec(document.getElementById('jh1').value, document.getElementById('jm1').value, document.getElementById('js1').value);
        if(!d || t1 === 0) return;
        const limitSec = Math.ceil(d / (CALC_LIMIT / 3600));
        document.getElementById('res3').style.display = 'block';
        document.getElementById('res3').innerHTML = `Szükséges beérkezési idő:<br><strong style="font-size:1.8rem; color:var(--success);">${toTimeStr(t1 + limitSec)}</strong>`;
    }

    function autoSetLaps(id, cont, isReal) {
        const d = document.getElementById(id === 'lapCount' ? 'totalDist' : 'totalDistT').value;
        const s = document.getElementById(id);
        s.innerHTML = '<option value="1">1 kör</option><option value="2">2 kör</option><option value="3">3 kör</option><option value="4">4 kör</option>';
        if (d == "20") s.value = "1"; else if (d == "40") s.value = "2"; else if (d == "60" || d == "80") s.value = "3"; else if (d == "100") s.value = "4";
        genLaps(id, cont, isReal);
    }

    function genLaps(id, cont, isReal) {
        const count = document.getElementById(id).value;
        const container = document.getElementById(cont);
        container.innerHTML = '';
        const prefix = isReal ? 'v' : 't';
        for(let i = 1; i <= count; i++) {
            let inputs = `<div class="lap-card"><h4>${i}. KÖR</h4><label>Táv (km):</label><input type="number" id="${prefix}d${i}" step="0.1" placeholder="20">`;
            
            if(isReal) {
                inputs += `
                <label>Beérkezés (Kapu):</label>
                <div class="time-group"><input type="number" id="${prefix}h${i}" oninput="jump(this, '${prefix}m${i}')">:<input type="number" id="${prefix}m${i}" oninput="jump(this, '${prefix}s${i}')">:<input type="number" id="${prefix}s${i}"></div>
                <label>Orvosi beérkezés (Vet):</label>
                <div class="time-group"><input type="number" id="o${prefix}h${i}" oninput="jump(this, 'o${prefix}m${i}')">:<input type="number" id="o${prefix}m${i}" oninput="jump(this, 'o${prefix}s${i}')">:<input type="number" id="o${prefix}s${i}"></div>
                `;
            }
            
            inputs += `</div>`;
            container.innerHTML += inputs;
        }
    }

    window.onload = function() {
        autoSetLaps('lapCount', 'lapInputsContainer', true);
        autoSetLaps('lapCountT', 'lapInputsContainerT', false);
    };
</script>
